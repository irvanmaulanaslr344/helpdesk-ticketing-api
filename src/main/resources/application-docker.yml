spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:helpdesk_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
    username: ${MYSQL_USER:helpdesk_user}
    password: ${MYSQL_PASSWORD:helpdesk_pass}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    cookie-secure: true